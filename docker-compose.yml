# Local stack: PostgreSQL + API + web. Copy .env.example to .env and fill in the secrets first.
name: nomina-ec

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: nomina
      POSTGRES_USER: ${DB_USER:?Define DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d nomina"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/nomina
      DB_USER: ${DB_USER:?Define DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD}
      DEMO_USERNAME: ${DEMO_USERNAME:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      DEMO_DATA: ${DEMO_DATA:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      COMPANY_NAME: ${COMPANY_NAME:-Empresa Demo S.A.}
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:8080"
    restart: unless-stopped

volumes:
  db-data:
