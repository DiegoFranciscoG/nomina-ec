name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks 8.30.1 (SHA-256 verificado)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Escanear historial completo
        run: ./gitleaks git . --redact --verbose --exit-code 1

  build-test:
    name: Build y tests
    runs-on: ubuntu-latest
    needs: secretos
    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        if: hashFiles('**/pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify (tests + cobertura)
        if: hashFiles('**/pom.xml') != ''
        run: |
          POM=$(git ls-files '*pom.xml' | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          cd "$(dirname "$POM")" && (./mvnw -B -ntp verify 2>/dev/null || mvn -B -ntp verify)
      - name: Node 22
        if: hashFiles('**/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm ci + test + build
        if: hashFiles('**/package-lock.json') != ''
        run: |
          for d in $(git ls-files '*package-lock.json' | grep -v node_modules | xargs -n1 dirname); do
            (cd "$d" && npm ci && npm test --if-present -- --watch=false && npm run build --if-present)
          done
      - name: Python 3.12
        if: hashFiles('**/requirements*.txt', '**/pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip + pytest
        if: hashFiles('**/requirements*.txt', '**/pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; elif [ -f requirements.txt ]; then pip install -r requirements.txt pytest; else pip install -e ".[dev]" || pip install -e . pytest; fi
          pytest -q
