name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar gitleaks 8.30.1 (SHA-256 verificado)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Escanear historial completo
        run: ./gitleaks git . -c .gitleaks.toml --redact --verbose --exit-code 1

  backend:
    name: Backend (Java 21 · unit + Testcontainers + JaCoCo)
    runs-on: ubuntu-24.04
    needs: secrets
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify (tests + cobertura >= 70 %)
        run: ./mvnw -B -ntp verify
      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          retention-days: 7

  frontend:
    name: Frontend (Angular · Vitest + build)
    runs-on: ubuntu-24.04
    needs: secrets
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  e2e:
    name: Docker Compose + Playwright e2e
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Secretos efímeros solo para este job (no se publican)
        run: |
          {
            echo "DB_USER=nomina"
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "DEMO_USERNAME=demo"
            echo "DEMO_PASSWORD=$(openssl rand -hex 16)"
            echo "DEMO_DATA=true"
            echo "CORS_ALLOWED_ORIGINS=http://127.0.0.1:4200"
          } > .env
          echo "E2E_PASSWORD=$(grep '^DEMO_PASSWORD=' .env | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Levantar stack (docker compose up --build)
        run: docker compose up --build -d --wait --wait-timeout 300
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Playwright
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs del stack si falla
        if: failure()
        run: docker compose logs --tail 200
      - name: Apagar stack
        if: always()
        run: docker compose down -v
